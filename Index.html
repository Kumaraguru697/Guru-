<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX Desk – live news and economic calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#e8ecf2; --panel:#ffffff; --rule:#cfd7e3;
  --ink:#101c33; --muted:#5b6b86; --live:#f5a524;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font:400 15px/1.5 "Schibsted Grotesk",system-ui,sans-serif;
  background:var(--page);color:var(--ink);
  display:flex;flex-direction:column;
}
header{
  flex:none;height:56px;padding:0 20px;
  background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
header h1{margin:0;font-size:18px;font-weight:700}
nav{display:flex;gap:20px}
nav a{color:#c9d4e6;text-decoration:none;font-weight:600;font-size:14px}
nav a:hover{color:#fff;text-decoration:underline}
a:focus-visible{outline:2px solid var(--live);outline-offset:3px}

main{
  flex:1;min-height:0;padding:12px;gap:12px;
  display:grid;grid-template-columns:minmax(320px,400px) 1fr;grid-template-rows:minmax(0,1fr);
}
section{
  background:var(--panel);border:1px solid var(--rule);border-radius:6px;
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
section h2{
  margin:0;padding:12px 16px;font-size:16px;font-weight:700;
  border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:8px;
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}

.feed{flex:1;min-height:0}
.feed iframe,
.tradingview-widget-container,
.tradingview-widget-container__widget{width:100%;height:100%;border:0;display:block}
.credit{margin:0;padding:8px 16px;border-top:1px solid var(--rule);font-size:12px;color:var(--muted)}
.credit a{color:inherit}

@media (max-width:860px){
  html,body{height:auto}
  main{grid-template-columns:1fr;grid-template-rows:none}
  .feed{flex:none;height:600px}
}
</style>
</head>
<body>

<header>
  <h1>FX Desk</h1>
  <nav aria-label="Source sites">
    <a href="https://www.investing.com/news/latest-news" target="_blank" rel="noopener">Investing.com news</a>
    <a href="https://www.forexfactory.com/calendar" target="_blank" rel="noopener">Forex Factory calendar</a>
  </nav>
</header>

<main>
  <section aria-labelledby="news-h">
    <h2 id="news-h"><span class="dot" aria-hidden="true"></span>Breaking news</h2>
    <div class="feed">
      <!-- Live forex headlines: TradingView's free news widget. Change "market" to "stock", "crypto", etc. -->
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
        {"feedMode":"market","market":"forex","colorTheme":"light","isTransparent":false,"displayMode":"regular","width":"100%","height":"100%","locale":"en"}
        </script>
      </div>
    </div>
    <p class="credit"><a href="https://www.tradingview.com/" target="_blank" rel="noopener nofollow">News by TradingView</a></p>
  </section>

  <section aria-labelledby="cal-h">
    <h2 id="cal-h">Economic calendar</h2>
    <div class="feed">
      <!-- To change columns, countries, colors or time zone, generate your own code on Investing.com's
           economic calendar widget page and replace this iframe with it. -->
      <iframe title="Economic calendar" loading="lazy"
        src="https://sslecal2.investing.com?columns=exc_flags,exc_currency,exc_importance,exc_actual,exc_forecast,exc_previous&amp;features=datepicker,timezone&amp;countries=25,32,6,37,72,22,17,39,14,10,35,43,56,36,110,11,26,12,4,5&amp;calType=week&amp;lang=1"></iframe>
    </div>
    <p class="credit">Real Time Economic Calendar provided by <a href="https://www.investing.com/" target="_blank" rel="nofollow noopener">Investing.com</a>.</p>
  </section>
</main>

</body>
</html>
